<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./src/index.browser.js"></script>
  </head>
  <body>
    <script>
      // let { x, y } = this

      let list = [1, 2, 3]
      let bool = true

      const change = () => {
        bool = !bool
        let list = Array(Math.floor(Math.random() * 10000)).fill(1)
        // .map((n) => Math.random())
        console.log('bool', bool)
      }
    </script>

    <button .title="bool" .onclick="change">${bool}: ${list.length}</button>

    <div if="bool">if</div>
    <div else-if="bool">else if</div>
    <div else>else</div>

    <ul>
      <li for="const item of list">${ item }</li>
    </ul>
  </body>
</html>
