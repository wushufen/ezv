<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./src/index.browser.js"></script>
  </head>
  <body>
    <script>
      let list = [1, 2, 3]
      let bool = true

      setTimeout(() => {
        bool = false
        list = [4, 5, 6, 7, 8, 9, 10]
        console.log('bool', bool)
      }, 3000)
    </script>

    <div>${ 'string' }</div>

    <div if="bool">if</div>
    <div else-if="bool">else if</div>
    <div else>else</div>

    <ul>
      <li for="const item of list">${ item }</li>
    </ul>

    <button
      .title="1 + 1"
      .onclick="()=>{
        bool=!bool
        console.log('bool', bool)
      }"
    >
      button
    </button>

    <div id="ezv">
      <span>${ Math.random() }</span>
      <span>${ Math.random() }</span>
      <span>${ Math.random() }</span>
    </div>
  </body>
</html>
